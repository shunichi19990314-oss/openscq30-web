# Render blueprint: https://render.com/docs/blueprint-spec
#
# This is a fully client side app (Web Serial talks to the headphones straight from the browser),
# so it deploys as a free static site. There is no server, no database and no user data leaves the
# browser.
services:
  - type: web
    name: openscq30-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: NOSNIFF
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: serial=(self), bluetooth=(self)
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
